<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Employees</title>
<meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <script src="/js/csrf.js" defer></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>
    body {
      background-color: #f5f6f8;
    }

    .sidebar {
      min-height: 100vh;
      background: #212529;
    }

    .sidebar a {
      color: #adb5bd;
      text-decoration: none;
      padding: 10px 12px;
      display: block;
      border-radius: 6px;
      margin-bottom: 4px;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: #343a40;
      color: #fff;
    }

    .error {
      color: #dc3545;
      font-size: 12px;
      margin-top: 4px;
    }

    #loading {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.6);
      display: none;
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .custom-toast {
      position: fixed;
      top: 20px;
      right: 20px;
      display: none;
      z-index: 3000;
      min-width: 220px;
    }
  </style>
</head>

<body>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <aside class="col-md-2 sidebar p-3">
      <h4 class="text-white mb-4">HR System</h4>

      <a href="/dashboard">一覧</a>
      <a class="active" href="/employees">社員管理</a>
      <a href="/departments">部署管理</a>
      <a class="nav-link text-white"
         href="/users"
         sec:authorize="hasAuthority('ROLE_ADMIN')">
        ユーザー管理
      </a>
    </aside>

    <!-- Main -->
    <main class="col-md-10 p-4">
      <!-- Header -->
      <div sec:authorize="isAuthenticated()">
        権限：
        <span sec:authentication="authorities"></span>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="mb-1">社員管理</h2>
          <div class="text-muted">Employee Management</div>
        </div>

        <div class="d-flex align-items-center">
          <span class="me-3 text-muted">
            ログイン中：
            <span th:text="${loginUser}">user</span>
          </span>

          <form th:action="@{/logout}" method="post" class="d-inline"><button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button></form>
        </div>
      </div>

      <!-- Search Card -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-md-4">
              <label for="searchName" class="form-label">名前検索（前方一致）</label>
              <input type="text"
                     id="searchName"
                     class="form-control"
                     placeholder="例：田中">
            </div>

            <div class="col-md-auto">
              <button type="button"
                      class="btn btn-primary"
                      onclick="searchEmployees(0)">
                検索
              </button>
            </div>

            <div class="col-md-auto">
              <button type="button"
                      class="btn btn-outline-secondary"
                      onclick="clearSearch()">
                クリア
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Table Card -->
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-white fw-bold">
          社員一覧
        </div>

        <div class="card-body">
          <div class="table-responsive">
            <table id="employeeTable" th:attr="data-can-edit=${#authorization.expression('hasRole(''ADMIN'')')}"
                   class="table table-hover align-middle text-nowrap mb-0">
            </table>
          </div>

          <div id="pagination" class="mt-3"></div>
        </div>
      </div>

      <!-- Form Card -->
      <div class="card shadow-sm" sec:authorize="hasRole('ADMIN')">
        <div class="card-header bg-white fw-bold">
          <span id="formTitle">New Employee</span>
        </div>

        <div class="card-body">
          <form id="employeeForm">
            <input type="hidden" id="id">

            <div class="row g-3">

              <div class="col-md-6">
                <label for="name" class="form-label">名前</label>
                <input type="text" id="name" class="form-control">
                <div id="nameError" class="error"></div>
              </div>

              <div class="col-md-6">
                <label for="email" class="form-label">メール</label>
                <input type="text" id="email" class="form-control">
                <div id="emailError" class="error"></div>
              </div>

              <div class="col-md-6">
                <label for="position" class="form-label">役職</label>
                <input type="text" id="position" class="form-control">
                <div id="positionError" class="error"></div>
              </div>

              <div class="col-md-6">
                <label for="departmentId" class="form-label">部署</label>
                <select id="departmentId" class="form-select">
                  <option value="">選択してください</option>
                </select>
                <div id="departmentIdError" class="error"></div>
              </div>

            </div>

            <div class="col-md-6 mb-3"><label for="employmentStatus" class="form-label">在籍ステータス</label>
<select id="employmentStatus" class="form-select"><option value="ACTIVE">在職</option><option value="ON_LEAVE">休職</option><option value="RETIRED">退職</option></select></div>
<div class="col-md-6 mb-3"><label for="employmentType" class="form-label">雇用区分</label>
<select id="employmentType" class="form-select"><option value="PERMANENT">正社員</option><option value="CONTRACT">契約社員</option><option value="OUTSOURCED">業務委託</option></select></div>
<div class="col-md-6 mb-3"><label for="hireDate" class="form-label">入社日</label><input type="date" id="hireDate" class="form-control"></div>
<div class="col-md-6 mb-3"><label for="retirementDate" class="form-label">退職日</label><input type="date" id="retirementDate" class="form-control"></div>
<div id="globalError" class="error mt-3"></div>

            <div class="mt-4 d-flex gap-2">
              <button type="submit" class="btn btn-primary">
                保存
              </button>

              <button type="button"
                      class="btn btn-outline-secondary"
                      onclick="resetForm()">
                キャンセル
              </button>
            </div>
          </form>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Loading -->
<div id="loading">
  <div class="spinner-border text-primary" role="status"></div>
</div>

<!-- Toast -->
<div id="toast" class="alert alert-dark custom-toast"></div>

<script src="/js/employees.js" defer></script>

</body>
</html>
